<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name ="Keywords" content="Countries Flags Search-Tool"/>
    <title>Flags From Around The Globe</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>

<body>
<header>
    <div class="logo">
        <img src=https://cdn-icons-png.flaticon.com/128/14538/14538918.png alt="EU" width="80" height="80">
        <div class="logo text">Flags From Around The Globe</div>
        <img src=https://cdn-icons-png.flaticon.com/128/2179/2179254.png alt:="Globe" width="80" height="80">
    </div>
</header>

<main>
    <div>
        <li>"Flag Search Tool"</li>
        <li>Enter a Countries name in the Search Bar below</li>
        <li>Find your favourite Flags!</li>
    </div>
</main>

<div class="sections-row">
    <section class="flag-search-area">
        <h3>Type Country Here:</h3>
        <input type="text" id="searchinput" placeholder="Search...">
        <button id="searchbutton">Enter</button>
    </section>

    <section class="flag-display-area">
        <h3>Display Area</h3>
        <div id="flag-display-area"></div>
    </section>
</div>

<footer>
    <div class="logo">
        <img src=https://i.etsystatic.com/35220712/r/il/e92762/3964499599/il_fullxfull.3964499599_4aun.jpg alt="World Map" width="850" height="500">  
    </div>
        <p>By Benjamin J</p>
</footer>

<!-- JavaScript -->
<script src="script.js"></script>
</body>
</html>
